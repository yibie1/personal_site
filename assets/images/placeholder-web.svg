<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2506ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b3fff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#grad1)"/>
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="bold">Coming Soon</text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle">Project Screenshot</text>
  <circle cx="400" cy="350" r="30" fill="none" stroke="white" stroke-width="3" opacity="0.5">
    <animate attributeName="r" from="30" to="50" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.5" to="0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
